# nginx vhost for circleftp-jellyfin, published through the Cloudflare Tunnel.
#
# Deliberately plain HTTP on :80. The tunnel's ingress is dashboard-managed with
# no API token on this host, so the ingress rule stays `http://localhost` and
# nginx serves this hostname without TLS — Cloudflare terminates TLS for the
# browser. This mirrors how cloud./photos.foliolab.app were already set up.
#
# IMPORTANT: this is its own server block. Do not add this hostname to the
# existing :80 block — that one's job is to 301 everything to HTTPS, and through
# the tunnel that becomes a redirect loop.

server {
    listen 80;
    listen [::]:80;
    server_name request.foliolab.app;

    # Without this every request looks like it came from 127.0.0.1, which would
    # make the app's login rate limiter throttle all users as one.
    include snippets/cloudflare-realip.conf;

    # Cloudflare's free plan caps request bodies at 100 MB anyway; this app only
    # ever receives small JSON.
    client_max_body_size 2m;

    access_log /var/log/nginx/circleftp-jellyfin.access.log;
    error_log  /var/log/nginx/circleftp-jellyfin.error.log;

    # The SSE progress stream. Buffering here would hold every frame until the
    # buffer filled, so the download bars would move in jerks or not at all.
    location /api/events {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        # A long-lived stream must not be reaped as an idle connection.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
